<ion-content class="page-bg" [scrollY]="false">
  <div class="aurora-glow"></div>

  <!-- Floating particles -->
  <div class="floating-particles">
    <span class="particle">✦</span>
    <span class="particle">✧</span>
    <span class="particle">·</span>
    <span class="particle">♡</span>
    <span class="particle">⋆</span>
    <span class="particle">˚</span>
    <span class="particle">✦</span>
    <span class="particle">·</span>
    <span class="particle">♡</span>
    <span class="particle">⋆</span>
  </div>

  <!-- Music bar -->
  <div class="music-bar">
    <div class="music-waves">
      <span class="wave"></span><span class="wave"></span>
      <span class="wave"></span><span class="wave"></span>
      <span class="wave"></span>
    </div>
    <span class="music-label">♪ Happy Birthday ♪</span>
    <div class="music-waves">
      <span class="wave"></span><span class="wave"></span>
      <span class="wave"></span><span class="wave"></span>
      <span class="wave"></span>
    </div>
  </div>

  <div class="greeting-wrapper">
    <p class="label-upper greeting-label">today is your day</p>

    <div class="glass-card greeting-card">
      <div class="cake-emoji">🎂</div>
      <h1 class="script-heading greeting-title">Happy<br>Birthday ❤️</h1>
      <div class="divider"></div>
      <p class="body-italic">
        On this beautiful day, I want you to know how truly extraordinary you are.
        This little world I made is yours — every pixel placed with love,
        every word meant just for you.
      </p>
    </div>

    <!-- Step nav -->
    <div class="step-nav">
      <ion-button class="pill-btn-ghost" fill="clear" routerLink="/opening">← back</ion-button>
      <ion-button class="pill-btn" routerLink="/memory-cards">continue →</ion-button>
    </div>

    <div class="nav-dots">
      <span class="nav-dot"></span>
      <span class="nav-dot active"></span>
      <span class="nav-dot"></span>
      <span class="nav-dot"></span>
      <span class="nav-dot"></span>
    </div>
  </div>
</ion-content>
