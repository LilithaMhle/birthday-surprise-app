<ion-content class="page-bg" [scrollY]="false">
  <div class="aurora-glow"></div>

  <!-- Floating particles -->
  <div class="floating-particles">
    <span class="particle">✦</span>
    <span class="particle">✧</span>
    <span class="particle">·</span>
    <span class="particle">♡</span>
    <span class="particle">⋆</span>
    <span class="particle">˚</span>
    <span class="particle">✦</span>
    <span class="particle">·</span>
    <span class="particle">♡</span>
    <span class="particle">⋆</span>
  </div>

  <!-- Center card -->
  <div class="opening-wrapper">
    <div class="glass-card opening-card">
      <!-- Pulsing sparkle button -->
      <button class="sparkle-btn" (click)="onStart()">
        <span class="sparkle-icon">✨</span>
      </button>

      <h1 class="script-heading opening-title">
        A surprise<br>just for you
      </h1>

      <div class="divider"></div>

      <p class="body-italic opening-sub">
        Someone who loves you very much<br>made this with their whole heart
      </p>

      <p class="opening-hint">tap the sparkle to begin</p>
    </div>

    <!-- Nav dots -->
    <div class="nav-dots opening-dots">
      <span class="nav-dot active"></span>
      <span class="nav-dot"></span>
      <span class="nav-dot"></span>
      <span class="nav-dot"></span>
      <span class="nav-dot"></span>
    </div>
  </div>
</ion-content>
